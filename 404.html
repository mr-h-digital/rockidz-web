<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var base = '/';
        var relativePath = path.indexOf(base) === 0 ? path.slice(base.length - 1) : path;
        var target = base + '?redirect=' + encodeURIComponent(relativePath);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
